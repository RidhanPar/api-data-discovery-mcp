[project]
name = "api-data-discovery-mcp"
version = "0.1.0"
description = "AI-powered discovery of Nordlys Insurance APIs and Data Products, exposed over the Model Context Protocol."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "openapi-spec-validator>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nordlys_discovery"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Hand-written catalog content: long description strings are data, not code.
"scripts/catalog_gen/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
