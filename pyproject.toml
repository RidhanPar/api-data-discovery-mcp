[project]
name = "api-data-discovery-mcp"
version = "0.1.0"
description = "AI-powered discovery of Nordlys Insurance APIs and Data Products, exposed over the Model Context Protocol."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "openapi-spec-validator>=0.7.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "numpy>=1.26",
    "mcp>=1.12",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
azure = [
    "openai>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "testcontainers[postgres]>=4.8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nordlys_discovery"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Hand-written catalog content: long description strings are data, not code.
"scripts/catalog_gen/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs Postgres with pgvector (testcontainers or NORDLYS_TEST_DATABASE_URL)"]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "testcontainers.*"]
ignore_missing_imports = true
