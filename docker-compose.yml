# Full local stack:  make up   (then: make demo-access-flow)
#
#   catalog   http://localhost:8000/docs     MCP server  http://localhost:8001/mcp
#   n8n       http://localhost:5678          Keycloak    http://localhost:8080 (admin/admin)
#   Mailpit   http://localhost:8025 (all e-mails sent by the workflows land here)
#
# Every secret below is a LOCAL DEVELOPMENT default, overridable from a git-ignored .env.
# In Azure all of them come from Key Vault (see infra/).
name: nordlys-discovery

x-app-env: &app-env
  NORDLYS_DATABASE_URL: postgresql+psycopg://nordlys:${POSTGRES_PASSWORD:-nordlys}@db:5432/nordlys
  NORDLYS_AUTH_ENABLED: "true"
  NORDLYS_OIDC_ISSUER: http://localhost:8080/realms/nordlys
  NORDLYS_OIDC_JWKS_URL: http://keycloak:8080/realms/nordlys/protocol/openid-connect/certs
  NORDLYS_LOG_LEVEL: INFO

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nordlys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nordlys}
      POSTGRES_DB: nordlys
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:-n8n}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-n8n-db.sh:/docker-entrypoint-initdb.d/10-n8n.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nordlys -d nordlys"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # Tokens always carry iss=http://localhost:8080/... whether fetched from the host or
      # from inside the network (http://keycloak:8080), so issuer checks agree everywhere.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["8080:8080"]
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 40

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  migrate:
    image: nordlys-discovery:dev
    build: .
    command: ["sh", "-c", "alembic upgrade head && python -m nordlys_discovery.ingest"]
    environment:
      <<: *app-env
      NORDLYS_REGISTRATIONS_DIR: /data/registrations
    volumes:
      - registrations:/data/registrations
    depends_on:
      db: {condition: service_healthy}

  catalog:
    image: nordlys-discovery:dev
    environment:
      <<: *app-env
      NORDLYS_REGISTRATIONS_DIR: /data/registrations
      NORDLYS_ACCESS_REQUEST_WEBHOOK_URL: http://n8n:5678/webhook/access-request-created
      NORDLYS_ACCESS_REQUEST_WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-webhook-secret-change-me}
    ports: ["8000:8000"]
    volumes:
      - registrations:/data/registrations
    depends_on:
      migrate: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}

  mcp:
    image: nordlys-discovery:dev
    command: ["python", "-m", "nordlys_discovery.mcp_server", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      <<: *app-env
      NORDLYS_CATALOG_API_URL: http://catalog:8000
      NORDLYS_MCP_CLIENT_SECRET: ${MCP_CLIENT_SECRET:-local-mcp-secret-change-me}
      NORDLYS_MCP_PUBLIC_URL: http://localhost:8001/mcp
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      catalog: {condition: service_healthy}

  agent:
    image: nordlys-discovery:dev
    command: ["uvicorn", "nordlys_discovery.agent.app:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      <<: *app-env
      NORDLYS_CATALOG_API_URL: http://catalog:8000
      # "none" = no generative steps: Workflow B then routes every registration to a human.
      NORDLYS_LLM_PROVIDER: ${NORDLYS_LLM_PROVIDER:-none}
      NORDLYS_AZURE_OPENAI_ENDPOINT: ${NORDLYS_AZURE_OPENAI_ENDPOINT:-}
      NORDLYS_AZURE_OPENAI_API_KEY: ${NORDLYS_AZURE_OPENAI_API_KEY:-}
      NORDLYS_AZURE_OPENAI_CHAT_DEPLOYMENT: ${NORDLYS_AZURE_OPENAI_CHAT_DEPLOYMENT:-gpt-4.1-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NORDLYS_OPENAI_API_KEY: ${NORDLYS_OPENAI_API_KEY:-}
      # /v1/ask: the agent calls the MCP server with its own least-privilege identity.
      NORDLYS_AGENT_MCP_URL: http://mcp:8001/mcp
      NORDLYS_AGENT_CLIENT_SECRET: ${AGENT_CLIENT_SECRET:-local-agent-secret-change-me}
    ports: ["8002:8002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      catalog: {condition: service_healthy}

  n8n-import:
    image: n8nio/n8n:2.41.6
    entrypoint: ["sh", "/import/import.sh"]
    environment: &n8n-env
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-n8n-encryption-key-change-me}
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Europe/Stockholm
      # Workflows read their configuration from the environment (no secrets in workflow JSON).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      NORDLYS_CATALOG_URL: http://catalog:8000
      NORDLYS_TOKEN_URL: http://keycloak:8080/realms/nordlys/protocol/openid-connect/token
      NORDLYS_KEYCLOAK_ADMIN_URL: http://keycloak:8080/admin/realms/nordlys
      NORDLYS_N8N_CLIENT_ID: nordlys-n8n
      NORDLYS_N8N_CLIENT_SECRET: ${N8N_CLIENT_SECRET:-local-n8n-secret-change-me}
      NORDLYS_WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-webhook-secret-change-me}
      NORDLYS_LINK_SIGNING_SECRET: ${LINK_SIGNING_SECRET:-local-link-secret-change-me}
      NORDLYS_APPROVAL_TIMEOUT_MINUTES: ${APPROVAL_TIMEOUT_MINUTES:-1440}
      NORDLYS_OPS_EMAIL: platform-ops@nordlys.example
      NORDLYS_REVIEWER_EMAIL: api-governance@nordlys.example
      NORDLYS_REVIEW_TIMEOUT_MINUTES: ${REVIEW_TIMEOUT_MINUTES:-4320}
      NORDLYS_REGISTRATION_API_KEY: ${REGISTRATION_API_KEY:-local-registration-key-change-me}
      NORDLYS_AGENT_URL: http://agent:8002
    volumes:
      - ./deploy/n8n:/import:ro
    depends_on:
      db: {condition: service_healthy}

  n8n:
    image: n8nio/n8n:2.41.6
    environment: *n8n-env
    ports: ["5678:5678"]
    depends_on:
      n8n-import: {condition: service_completed_successfully}
      mailpit: {condition: service_started}

volumes:
  pgdata:
  registrations:
