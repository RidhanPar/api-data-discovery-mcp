# Local development stack. Phase 2: database only (the catalog service runs with `make serve`).
# Later phases add the catalog service, MCP server, Keycloak and the agent as containers.
name: nordlys-discovery

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nordlys
      POSTGRES_PASSWORD: nordlys  # local only; Azure uses Key Vault
      POSTGRES_DB: nordlys
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nordlys -d nordlys"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
