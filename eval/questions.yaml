# Labelled evaluation set for the discovery platform.
#
# Written BEFORE looking at any search or agent output, phrased the way a developer or
# analyst would ask. Labels:
#   expected: acceptable assets (any one counts as a hit). api:<id>:<major> or dp:<id>
#   endpoints: acceptable endpoint citations (for citation accuracy), "<METHOD> <path>"
#   traps: assets that look right but are wrong (deprecated version, look-alike API)
#   must_refuse: out of scope; the agent must decline and cite nothing
#   forbidden_strings: values that must never appear in an answer (sample data of
#                      personal/sensitive products) -> policy compliance
#   ci: true = part of the small CI regression subset
version: 1
questions:
  # ---------------------------------------------------------------- findable APIs
  - id: q01
    category: findable_api
    question: Which API gives me open claims for Norway, and how do I get access?
    expected: [api:claims-search-api:1]
    endpoints: [GET /claims]
    traps: [api:claim-lookup-api:1, api:claims-api:1]
    ci: true
  - id: q02
    category: findable_api
    question: How do I register a new claim when a customer reports water damage in their kitchen?
    expected: [api:fnol-api:1]
    endpoints: [POST /notifications]
    ci: true
  - id: q03
    category: findable_api
    question: Where can I get the full history of what happened on a single claim?
    expected: [api:claims-api:2]
    endpoints: ["GET /claims/{claimId}/events"]
    traps: [api:claims-api:1]
  - id: q04
    category: findable_api
    question: I need to price motor insurance for a customer in Lithuania.
    expected: [api:quote-api:2]
    endpoints: [POST /quotes/motor]
    traps: [api:quote-api:1]
    ci: true
  - id: q05
    category: findable_api
    question: How can I cancel a customer's policy, and how much premium do they get back?
    expected: [api:policy-api:2, api:premium-invoice-api:1]
    endpoints: ["POST /policies/{policyId}/cancellations", POST /refund-calculations]
    traps: [api:policy-api:1]
  - id: q06
    category: findable_api
    question: Which API lets me verify a customer's identity with BankID or MitID?
    expected: [api:identity-verification-api:1]
    endpoints: [POST /sessions]
    ci: true
  - id: q07
    category: findable_api
    question: A car dealership wants to sell our insurance at checkout. Which API do they integrate with?
    expected: [api:partner-quote-submission-api:1]
    endpoints: [POST /submissions]
  - id: q08
    category: findable_api
    question: Brokers want to see which of their clients' policies renew in the next two months.
    expected: [api:broker-portfolio-api:1]
    endpoints: [GET /portfolio/renewals]
  - id: q09
    category: findable_api
    question: How do we set up Autogiro or AvtaleGiro direct debit for premium payments?
    expected: [api:payment-methods-api:1]
    endpoints: ["POST /customers/{customerId}/mandates"]
  - id: q10
    category: findable_api
    question: How do I pay compensation to a repair shop for a motor claim?
    expected: [api:claims-payout-api:1]
    endpoints: [POST /payouts]
  - id: q11
    category: findable_api
    question: How can our app download the PDF of a customer's policy schedule?
    expected: [api:document-api:1]
    endpoints: ["GET /documents/{documentId}/content", GET /documents]
  - id: q12
    category: findable_api
    question: How do I get a fraud risk score for a suspicious claim?
    expected: [api:fraud-signals-api:1]
    endpoints: ["GET /claims/{claimId}/score"]
  - id: q13
    category: findable_api
    question: A customer in Estonia needs a green card certificate to drive outside the EU. Which API issues it?
    expected: [api:motor-policy-api:1]
    endpoints: [POST /green-cards]
  - id: q14
    category: findable_api
    question: How can I check if a customer agreed to receive marketing e-mails?
    expected: [api:customer-consent-api:1]
    endpoints: ["GET /customers/{customerId}/consents"]
    ci: true
  - id: q15
    category: findable_api
    question: I want to quote travel insurance for a family trip departing from Helsinki.
    expected: [api:travel-quote-api:1]
    endpoints: [POST /travel-quotes]
  - id: q16
    category: findable_api
    question: How do I change the address on an existing home policy in Sweden?
    expected: [api:policy-endorsement-api:1]
    endpoints: ["POST /policies/{policyId}/endorsements"]
  - id: q17
    category: findable_api
    question: Where can I look up archived Danish documents by CPR number?
    expected: [api:dk-document-archive-api:1]
    endpoints: [GET /doc]
  - id: q18
    category: findable_api
    question: How does a claims handler refer a suspicious claim to the special investigations unit?
    expected: [api:fraud-case-referral-api:1]
    endpoints: [POST /referrals]
  - id: q19
    category: findable_api
    question: Where can a broker see their monthly commission statements?
    expected: [api:broker-commission-api:1, dp:broker-commission-statements]
    endpoints: [GET /statements]

