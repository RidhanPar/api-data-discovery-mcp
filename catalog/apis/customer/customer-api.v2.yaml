# GENERATED by scripts/catalog_gen - synthetic data for the fictional Nordlys Insurance.
openapi: 3.1.0
info:
  title: Customer API
  version: 2.8.0
  description: |-
    Golden record for customers across all markets (v1 was retired in 2025).

    National identity numbers are masked unless the token carries `customer.read.pii`, which requires a DPO-approved purpose.
  license:
    name: Proprietary - Nordlys Insurance internal use
    identifier: LicenseRef-Nordlys
  x-nordlys:
    api-id: customer-api
    domain: customer
    owner-team: customer-data
    countries:
    - SE
    - 'NO'
    - FI
    - DK
    - EE
    - LV
    - LT
    audience: internal
    data-classification: personal
    support: '#team-customer-data'
    lifecycle:
      status: active
servers:
- url: https://api.nordlys.example/customer/v2
  description: Production
- url: https://api.test.nordlys.example/customer/v2
  description: Test
security:
- oauth2:
  - customer.read
paths:
  /customers:
    get:
      summary: Search customers
      description: Exact-match search. At least one filter is required.
      operationId: searchCustomers
      parameters:
      - name: email
        in: query
        schema:
          type: string
      - name: phone
        in: query
        schema:
          type: string
      - name: nationalId
        in: query
        description: Requires `customer.read.pii`.
        schema:
          type: string
      - name: cursor
        in: query
        description: Cursor returned as `nextCursor` by the previous page.
        schema:
          type: string
      - name: limit
        in: query
        description: Page size (1-200).
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    description: Opaque cursor for the next page, null on the last page.
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - customer.read
  /customers/{customerId}:
    get:
      summary: Get customer
      operationId: getCustomer
      parameters:
      - name: customerId
        in: path
        description: Customer id.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - customer.read
    patch:
      summary: Update contact details
      description: Only email, phone, address and preferredLanguage can be changed here.
      operationId: updateCustomerContact
      parameters:
      - name: customerId
        in: path
        description: Customer id.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                phone:
                  type: string
                address:
                  type: object
                  properties:
                    street:
                      type: string
                    postalCode:
                      type: string
                    city:
                      type: string
                    country:
                      $ref: '#/components/schemas/Country'
                preferredLanguage:
                  type: string
                  enum:
                  - sv
                  - nb
                  - fi
                  - da
                  - et
                  - lv
                  - lt
                  - en
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - customer.write
  /customers/{customerId}/policies:
    get:
      summary: Policy ids held by the customer
      description: Convenience lookup; returns ids only. Fetch details from the Policy API v2.
      operationId: listCustomerPolicies
      parameters:
      - name: customerId
        in: path
        description: Customer id.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Policy ids
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - customer.read
components:
  schemas:
    Problem:
      type: object
      description: Error body following RFC 9457 (Problem Details for HTTP APIs).
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
          format: uri-reference
        title:
          type: string
          description: Short human-readable summary.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference for this occurrence.
          format: uri-reference
        correlationId:
          type: string
          description: Trace id to quote when contacting the owning team.
    Money:
      type: object
      description: A monetary amount.
      required:
      - amount
      - currency
      properties:
        amount:
          type: string
          description: Decimal amount as a string to avoid float rounding.
          pattern: ^-?\d+(\.\d{1,2})?$
        currency:
          type: string
          description: ISO 4217 currency code.
          enum:
          - SEK
          - NOK
          - DKK
          - EUR
    Country:
      type: string
      description: ISO 3166-1 alpha-2 market code.
      enum:
      - SE
      - 'NO'
      - FI
      - DK
      - EE
      - LV
      - LT
    Customer:
      type: object
      description: A private or business customer.
      required:
      - customerId
      - type
      properties:
        customerId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - private
          - business
        nationalId:
          type: string
          description: Personnummer / fødselsnummer / henkilötunnus / CPR / personal code. Only returned with scope
            `customer.read.pii`.
        firstName:
          type: string
        lastName:
          type: string
        companyName:
          type:
          - string
          - 'null'
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: object
          properties:
            street:
              type: string
            postalCode:
              type: string
            city:
              type: string
            country:
              $ref: '#/components/schemas/Country'
        preferredLanguage:
          type: string
          enum:
          - sv
          - nb
          - fi
          - da
          - et
          - lv
          - lt
          - en
        segment:
          type: string
          description: Marketing segment, e.g. `young_urban`.
        createdAt:
          type: string
          format: date-time
  responses:
    E400:
      description: Request failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: Token lacks the required scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E429:
      description: Rate limit exceeded; honour the Retry-After header.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.1 via the Nordlys identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://auth.nordlys.example/realms/nordlys/protocol/openid-connect/token
          scopes:
            customer.read: Read customer profile (national id masked)
            customer.read.pii: Read unmasked national identity number
            customer.write: Update contact details
