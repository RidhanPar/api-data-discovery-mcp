# GENERATED by scripts/catalog_gen - synthetic data for the fictional Nordlys Insurance.
openapi: 3.1.0
info:
  title: Identity Verification API
  version: 1.2.0
  description: 'Strong customer authentication with the national eID schemes: BankID (SE, NO), FTN (FI), MitID (DK),
    Smart-ID and Mobile-ID (EE, LV, LT). Wraps the eID broker so product teams never integrate with each scheme
    directly.'
  license:
    name: Proprietary - Nordlys Insurance internal use
    identifier: LicenseRef-Nordlys
  x-nordlys:
    api-id: identity-verification-api
    domain: customer
    owner-team: identity-and-access
    countries:
    - SE
    - 'NO'
    - FI
    - DK
    - EE
    - LV
    - LT
    audience: internal
    data-classification: sensitive
    support: '#team-identity-and-access'
    lifecycle:
      status: active
servers:
- url: https://api.nordlys.example/identity-verification/v1
  description: Production
- url: https://api.test.nordlys.example/identity-verification/v1
  description: Test
security:
- oauth2:
  - idv.session
paths:
  /sessions:
    post:
      summary: Start an eID verification
      operationId: startVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              properties:
                method:
                  type: string
                  description: eID method. Smart-ID / Mobile-ID are used in the Baltics.
                  enum:
                  - bankid_se
                  - bankid_no
                  - ftn_fi
                  - mitid_dk
                  - smart_id
                  - mobile_id
                endUserIp:
                  type: string
      responses:
        '201':
          description: Session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSession'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - idv.session
  /sessions/{sessionId}:
    get:
      summary: Poll session status
      description: Poll every 2 seconds. Sessions expire after 3 minutes.
      operationId: pollVerification
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationSession'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - idv.session
components:
  schemas:
    Problem:
      type: object
      description: Error body following RFC 9457 (Problem Details for HTTP APIs).
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
          format: uri-reference
        title:
          type: string
          description: Short human-readable summary.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference for this occurrence.
          format: uri-reference
        correlationId:
          type: string
          description: Trace id to quote when contacting the owning team.
    Money:
      type: object
      description: A monetary amount.
      required:
      - amount
      - currency
      properties:
        amount:
          type: string
          description: Decimal amount as a string to avoid float rounding.
          pattern: ^-?\d+(\.\d{1,2})?$
        currency:
          type: string
          description: ISO 4217 currency code.
          enum:
          - SEK
          - NOK
          - DKK
          - EUR
    Country:
      type: string
      description: ISO 3166-1 alpha-2 market code.
      enum:
      - SE
      - 'NO'
      - FI
      - DK
      - EE
      - LV
      - LT
    VerificationSession:
      type: object
      required:
      - sessionId
      - method
      - status
      properties:
        sessionId:
          type: string
          format: uuid
        method:
          type: string
          description: eID method. Smart-ID / Mobile-ID are used in the Baltics.
          enum:
          - bankid_se
          - bankid_no
          - ftn_fi
          - mitid_dk
          - smart_id
          - mobile_id
        status:
          type: string
          enum:
          - pending
          - complete
          - failed
          - expired
        autoStartToken:
          type:
          - string
          - 'null'
          description: For launching the eID app on the same device.
        verifiedNationalId:
          type:
          - string
          - 'null'
          description: Only present when status = complete.
  responses:
    E400:
      description: Request failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: Token lacks the required scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E429:
      description: Rate limit exceeded; honour the Retry-After header.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.1 via the Nordlys identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://auth.nordlys.example/realms/nordlys/protocol/openid-connect/token
          scopes:
            idv.session: Start and poll verification sessions
