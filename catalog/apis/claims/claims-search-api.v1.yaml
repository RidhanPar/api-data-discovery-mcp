openapi: 3.1.0
info:
  title: Claims Search API
  version: 1.2.0
  description: |-
    Search and filter claims across all customers and markets - for example all open claims in Norway, or motor claims reported last week in Finland. Backed by a search index that lags the claims system by up to 60 seconds.

    Returns summaries; fetch the full claim from the Claims API v2.
  license:
    name: Proprietary - Nordlys Insurance internal use
    identifier: LicenseRef-Nordlys
  x-nordlys:
    api-id: claims-search-api
    domain: claims
    owner-team: claims-platform
    countries:
    - SE
    - 'NO'
    - FI
    - DK
    - EE
    - LV
    - LT
    audience: internal
    data-classification: personal
    support: '#team-claims-platform'
    lifecycle:
      status: active
servers:
- url: https://api.nordlys.example/claims-search/v1
  description: Production
- url: https://api.test.nordlys.example/claims-search/v1
  description: Test
security:
- oauth2:
  - claims.search
paths:
  /claims:
    get:
      summary: Search claims
      description: Filter claims by status, market, line of business and reported date. `status=open` matches every
        non-terminal status (registered, open, in_assessment, awaiting_documents, reopened).
      operationId: searchClaims
      parameters:
      - name: status
        in: query
        description: Status filter. `open` = all non-terminal statuses.
        schema:
          type: string
          enum:
          - open
          - closed
          - any
          - registered
          - open
          - in_assessment
          - awaiting_documents
          - approved
          - rejected
          - paid
          - closed
          - reopened
      - name: country
        in: query
        description: Market, e.g. `NO` for Norway.
        schema:
          type: string
          description: ISO 3166-1 alpha-2 market code.
          enum:
          - SE
          - 'NO'
          - FI
          - DK
          - EE
          - LV
          - LT
      - name: productLine
        in: query
        description: Line of business.
        schema:
          type: string
      - name: reportedFrom
        in: query
        description: Reported on or after.
        schema:
          type: string
          format: date
      - name: reportedTo
        in: query
        description: Reported on or before.
        schema:
          type: string
          format: date
      - name: lossCause
        in: query
        description: Cause code.
        schema:
          type: string
      - name: cursor
        in: query
        description: Cursor returned as `nextCursor` by the previous page.
        schema:
          type: string
      - name: limit
        in: query
        description: Page size (1-200).
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Matching claims
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClaimSummary'
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    description: Opaque cursor for the next page, null on the last page.
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - claims.search
  /claims/aggregations:
    get:
      summary: Count claims by dimension
      description: Counts grouped by status, country or productLine. No personal data returned.
      operationId: aggregateClaims
      parameters:
      - name: groupBy
        in: query
        required: true
        schema:
          type: string
          enum:
          - status
          - country
          - productLine
          - lossCause
      - name: country
        in: query
        schema:
          type: string
          description: ISO 3166-1 alpha-2 market code.
          enum:
          - SE
          - 'NO'
          - FI
          - DK
          - EE
          - LV
          - LT
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Buckets
          content:
            application/json:
              schema:
                type: object
                properties:
                  buckets:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        count:
                          type: integer
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - claims.search
components:
  schemas:
    Problem:
      type: object
      description: Error body following RFC 9457 (Problem Details for HTTP APIs).
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
          format: uri-reference
        title:
          type: string
          description: Short human-readable summary.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference for this occurrence.
          format: uri-reference
        correlationId:
          type: string
          description: Trace id to quote when contacting the owning team.
    Money:
      type: object
      description: A monetary amount.
      required:
      - amount
      - currency
      properties:
        amount:
          type: string
          description: Decimal amount as a string to avoid float rounding.
          pattern: ^-?\d+(\.\d{1,2})?$
        currency:
          type: string
          description: ISO 4217 currency code.
          enum:
          - SEK
          - NOK
          - DKK
          - EUR
    Country:
      type: string
      description: ISO 3166-1 alpha-2 market code.
      enum:
      - SE
      - 'NO'
      - FI
      - DK
      - EE
      - LV
      - LT
    ClaimSummary:
      type: object
      description: Lightweight claim projection returned by search.
      required:
      - claimId
      - claimNumber
      - status
      - country
      properties:
        claimId:
          type: string
          format: uuid
        claimNumber:
          type: string
        status:
          type: string
          enum:
          - registered
          - open
          - in_assessment
          - awaiting_documents
          - approved
          - rejected
          - paid
          - closed
          - reopened
        country:
          $ref: '#/components/schemas/Country'
        productLine:
          type: string
        lossDate:
          type: string
          format: date
        reportedAt:
          type: string
          format: date-time
        reserve:
          $ref: '#/components/schemas/Money'
  responses:
    E400:
      description: Request failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: Token lacks the required scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E429:
      description: Rate limit exceeded; honour the Retry-After header.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.1 via the Nordlys identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://auth.nordlys.example/realms/nordlys/protocol/openid-connect/token
          scopes:
            claims.search: Search claims across customers
