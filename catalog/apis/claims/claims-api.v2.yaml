openapi: 3.1.0
info:
  title: Claims API
  version: 2.6.1
  description: |-
    System-of-record API for individual claims. Read a claim, follow its event history, move it through the handling workflow and add notes.

    Looking for *lists* of claims across customers (e.g. all open claims in a market)? Use the Claims Search API. Registering a brand new claim? Use the FNOL API.
  license:
    name: Proprietary - Nordlys Insurance internal use
    identifier: LicenseRef-Nordlys
  x-nordlys:
    api-id: claims-api
    domain: claims
    owner-team: claims-platform
    countries:
    - SE
    - 'NO'
    - FI
    - DK
    - EE
    - LV
    - LT
    audience: internal
    data-classification: personal
    support: '#team-claims-platform'
    lifecycle:
      status: active
servers:
- url: https://api.nordlys.example/claims/v2
  description: Production
- url: https://api.test.nordlys.example/claims/v2
  description: Test
security:
- oauth2:
  - claims.read
tags:
- name: Claims
- name: Events
- name: Notes
paths:
