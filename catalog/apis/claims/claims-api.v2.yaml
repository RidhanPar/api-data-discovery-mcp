        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - claims.write
components:
  schemas:
    Problem:
      type: object
      description: Error body following RFC 9457 (Problem Details for HTTP APIs).
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
          format: uri-reference
        title:
          type: string
          description: Short human-readable summary.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference for this occurrence.
          format: uri-reference
        correlationId:
          type: string
          description: Trace id to quote when contacting the owning team.
    Money:
      type: object
      description: A monetary amount.
      required:
      - amount
      - currency
      properties:
        amount:
          type: string
          description: Decimal amount as a string to avoid float rounding.
          pattern: ^-?\d+(\.\d{1,2})?$
        currency:
          type: string
          description: ISO 4217 currency code.
          enum:
          - SEK
          - NOK
          - DKK
          - EUR
    Country:
      type: string
      description: ISO 3166-1 alpha-2 market code.
      enum:
      - SE
      - 'NO'
      - FI
      - DK
      - EE
      - LV
      - LT
    Claim:
      type: object
      description: A claim as held in the claims handling system.
      required:
      - claimId
      - claimNumber
      - policyId
      - status
      - country
      - lossDate
      properties:
        claimId:
          type: string
          description: Technical claim id.
          format: uuid
        claimNumber:
          type: string
          description: Claim reference shown to the customer, e.g. NO-CLM-2026-004211.
        policyId:
          type: string
          description: Policy the claim is registered against.
          format: uuid
        customerId:
          type: string
          format: uuid
        status:
          type: string
          description: Claim handling status.
          enum:
          - registered
          - open
          - in_assessment
          - awaiting_documents
          - approved
          - rejected
          - paid
          - closed
          - reopened
        productLine:
          type: string
          enum:
          - home
          - motor
          - travel
          - pet
          - accident
          - commercial_property
        country:
          $ref: '#/components/schemas/Country'
        lossDate:
          type: string
          description: Date the loss occurred.
          format: date
        reportedAt:
          type: string
          description: When the claim was first reported.
          format: date-time
        lossCause:
          type: string
          description: Cause code, e.g. `water_leak`, `theft`, `collision`, `storm`.
        reserve:
          $ref: '#/components/schemas/Money'
        paidToDate:
          $ref: '#/components/schemas/Money'
        handlerTeam:
          type: string
          description: Claims handling unit currently responsible.
    ClaimEvent:
      type: object
      required:
      - eventId
      - type
      - occurredAt
      properties:
        eventId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - status_changed
          - document_received
          - payment_made
          - note_added
          - reserve_changed
        occurredAt:
          type: string
          format: date-time
        data:
          type: object
          description: Event-specific payload.
  responses:
    E400:
      description: Request failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: Token lacks the required scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E429:
      description: Rate limit exceeded; honour the Retry-After header.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.1 via the Nordlys identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://auth.nordlys.example/realms/nordlys/protocol/openid-connect/token
          scopes:
            claims.read: Read claims and events
            claims.write: Change claim status, add notes
