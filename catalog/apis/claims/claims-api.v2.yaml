        description: Claim id (UUID).
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The claim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - claims.read
  /claims/by-number/{claimNumber}:
    get:
      tags:
      - Claims
      summary: Get a claim by its customer-facing number
      operationId: getClaimByNumber
      parameters:
      - name: claimNumber
        in: path
        description: Claim number, e.g. SE-CLM-2026-000123.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The claim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - claims.read
  /claims/{claimId}/status:
    patch:
      tags:
      - Claims
      summary: Move a claim to a new status
      description: Only transitions allowed by the claims workflow are accepted; others return 422.
      operationId: updateClaimStatus
      parameters:
      - name: claimId
        in: path
        description: Claim id.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - registered
                  - open
                  - in_assessment
                  - awaiting_documents
                  - approved
                  - rejected
                  - paid
                  - closed
                  - reopened
                reason:
                  type: string
      responses:
        '200':
          description: Updated claim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
