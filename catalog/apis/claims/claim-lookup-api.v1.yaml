# GENERATED by scripts/catalog_gen - synthetic data for the fictional Nordlys Insurance.
openapi: 3.1.0
info:
  title: Claim Lookup API
  version: 1.0.3
  description: Lookup claim cases. Used by My Pages and the Nordlys app to show the status of a customer's claims.
    Supports filtering by state and market.
  license:
    name: Proprietary - Nordlys Insurance internal use
    identifier: LicenseRef-Nordlys
  x-nordlys:
    api-id: claim-lookup-api
    domain: claims
    owner-team: digital-channels
    countries:
    - SE
    - 'NO'
    - FI
    - DK
    audience: channel-bff
    data-classification: personal
    support: '#team-digital-channels'
    lifecycle:
      status: active
servers:
- url: https://api.nordlys.example/digital/claim-lookup/v1
  description: Production
- url: https://api.test.nordlys.example/digital/claim-lookup/v1
  description: Test
security:
- oauth2:
  - claims.read.self
paths:
  /claim-cases:
    get:
      summary: Get claim cases
      description: Returns claim cases filtered by state and market. Only cases belonging to the customer in the
        access token (`sub`) are returned.
      operationId: getClaimCases
      parameters:
      - name: state
        in: query
        schema:
          type: string
          enum:
          - OPEN
          - WAITING_FOR_CUSTOMER
          - DECIDED
          - PAID
          - CLOSED
      - name: market
        in: query
        description: NO, SE, DK or FI
        schema:
          type: string
      responses:
        '200':
          description: cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClaimCase'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - claims.read.self
  /claim-cases/{caseRef}:
    get:
      summary: Get one claim case
      operationId: getClaimCase
      parameters:
      - name: caseRef
        in: path
        description: claim reference
        required: true
        schema:
          type: string
      responses:
        '200':
          description: case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimCase'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - claims.read.self
components:
  schemas:
    Problem:
      type: object
      description: Error body following RFC 9457 (Problem Details for HTTP APIs).
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
          format: uri-reference
        title:
          type: string
          description: Short human-readable summary.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference for this occurrence.
          format: uri-reference
        correlationId:
          type: string
          description: Trace id to quote when contacting the owning team.
    Money:
      type: object
      description: A monetary amount.
      required:
      - amount
      - currency
      properties:
        amount:
          type: string
          description: Decimal amount as a string to avoid float rounding.
          pattern: ^-?\d+(\.\d{1,2})?$
        currency:
          type: string
          description: ISO 4217 currency code.
          enum:
          - SEK
          - NOK
          - DKK
          - EUR
    Country:
      type: string
      description: ISO 3166-1 alpha-2 market code.
      enum:
      - SE
      - 'NO'
      - FI
      - DK
      - EE
      - LV
      - LT
    ClaimCase:
      type: object
      required:
      - caseRef
      - state
      - market
      properties:
        caseRef:
          type: string
          description: claim reference
        state:
          type: string
          enum:
          - OPEN
          - WAITING_FOR_CUSTOMER
          - DECIDED
          - PAID
          - CLOSED
        market:
          type: string
          description: NO/SE/DK/FI
        title:
          type: string
          description: short text shown in app e.g. 'Water damage kitchen'
        reportedDate:
          type: string
          format: date
        nextStep:
          type: string
          description: what the customer needs to do next, localised
  responses:
    E400:
      description: Request failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: Token lacks the required scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E429:
      description: Rate limit exceeded; honour the Retry-After header.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.1 via the Nordlys identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://auth.nordlys.example/realms/nordlys/protocol/openid-connect/token
          scopes:
            claims.read.self: Read the authenticated customer's own claims
        authorizationCode:
          authorizationUrl: https://auth.nordlys.example/realms/nordlys/protocol/openid-connect/auth
          tokenUrl: https://auth.nordlys.example/realms/nordlys/protocol/openid-connect/token
          scopes:
            claims.read.self: Read the authenticated customer's own claims
