openapi: 3.1.0
info:
  title: Quote API
  version: 2.4.0
  description: |-
    Price home and motor insurance for private customers in all markets and turn an accepted quote into a policy (bind).

    Changes from v1: typed risk models per product line, several priced packages per quote, proper 4xx validation errors instead of `200 + error`, Baltic markets added.
  license:
    name: Proprietary - Nordlys Insurance internal use
    identifier: LicenseRef-Nordlys
  x-nordlys:
    api-id: quote-api
    domain: quotes
    owner-team: pricing-and-quotes
    countries:
    - SE
    - 'NO'
    - FI
    - DK
    - EE
    - LV
    - LT
    audience: internal
    data-classification: personal
    support: '#team-pricing-and-quotes'
    lifecycle:
      status: active
servers:
- url: https://api.nordlys.example/quote/v2
  description: Production
- url: https://api.test.nordlys.example/quote/v2
  description: Test
security:
- oauth2:
  - quote.create
paths:
  /quotes/home:
    post:
      summary: Price home insurance
      operationId: quoteHome
      parameters:
      - name: Idempotency-Key
        in: header
        description: Client-generated UUID; retries with the same key return the original result.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - country
              - risk
              properties:
                country:
                  $ref: '#/components/schemas/Country'
                risk:
                  $ref: '#/components/schemas/HomeRisk'
                customerId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Quote created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - quote.create
  /quotes/motor:
    post:
      summary: Price motor insurance
      operationId: quoteMotor
      parameters:
      - name: Idempotency-Key
        in: header
        description: Client-generated UUID; retries with the same key return the original result.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - country
              - risk
              properties:
                country:
                  $ref: '#/components/schemas/Country'
                risk:
                  $ref: '#/components/schemas/MotorRisk'
                customerId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Quote created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - quote.create
  /quotes/{quoteId}:
    get:
      summary: Get a quote
      operationId: getQuote
      parameters:
      - name: quoteId
        in: path
        description: Quote id.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - quote.create
  /quotes/{quoteId}/bind:
    post:
      summary: Bind a quote into a policy
      description: Creates the policy in the Policy API. The chosen package must still be within `validUntil`.
      operationId: bindQuote
      parameters:
      - name: quoteId
        in: path
        description: Quote id.
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        description: Client-generated UUID; retries with the same key return the original result.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - packageCode
              - inceptionDate
              properties:
                packageCode:
                  type: string
                inceptionDate:
                  type: string
                  format: date
                paymentFrequency:
                  type: string
                  enum:
                  - annual
                  - monthly
      responses:
        '201':
          description: Policy created
          content:
            application/json:
              schema:
                type: object
                properties:
                  policyId:
                    type: string
                    format: uuid
                  policyNumber:
                    type: string
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
        '409':
          description: Quote expired or already bound.
      security:
      - oauth2:
        - quote.bind
components:
  schemas:
    Problem:
      type: object
      description: Error body following RFC 9457 (Problem Details for HTTP APIs).
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
          format: uri-reference
        title:
          type: string
          description: Short human-readable summary.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference for this occurrence.
          format: uri-reference
        correlationId:
          type: string
          description: Trace id to quote when contacting the owning team.
    Money:
      type: object
      description: A monetary amount.
      required:
      - amount
      - currency
      properties:
        amount:
          type: string
          description: Decimal amount as a string to avoid float rounding.
          pattern: ^-?\d+(\.\d{1,2})?$
        currency:
          type: string
          description: ISO 4217 currency code.
          enum:
          - SEK
          - NOK
          - DKK
          - EUR
    Country:
      type: string
      description: ISO 3166-1 alpha-2 market code.
      enum:
      - SE
      - 'NO'
      - FI
      - DK
      - EE
      - LV
      - LT
    Quote:
      type: object
      required:
      - quoteId
      - productLine
      - country
      - status
      properties:
        quoteId:
          type: string
          format: uuid
        productLine:
          type: string
          enum:
          - home
          - motor
        country:
          $ref: '#/components/schemas/Country'
        options:
          type: array
          description: Priced package alternatives.
          items:
            type: object
            properties:
              packageCode:
                type: string
                description: e.g. BASIC, STANDARD, PLUS
              annualPremium:
                $ref: '#/components/schemas/Money'
              monthlyPremium:
                $ref: '#/components/schemas/Money'
              coverages:
                type: array
                items:
                  type: string
        validUntil:
          type: string
          description: Price guaranteed until.
          format: date-time
        status:
          type: string
          enum:
          - priced
          - declined
          - referred
          - bound
          - expired
        declineReason:
          type:
          - string
          - 'null'
    HomeRisk:
      type: object
      description: Risk data for home insurance.
      required:
      - postalCode
      - livingAreaSqm
      - buildingType
      properties:
        postalCode:
          type: string
        livingAreaSqm:
          type: integer
          minimum: 10
          maximum: 1000
        buildingType:
          type: string
          enum:
          - apartment
          - detached_house
          - terraced_house
          - holiday_home
        constructionYear:
          type: integer
        residents:
          type: integer
          minimum: 1
    MotorRisk:
      type: object
      description: Risk data for motor insurance.
      required:
      - registrationNumber
      - annualMileageKm
      properties:
        registrationNumber:
          type: string
          description: Vehicle registration plate; vehicle data is looked up in the national register.
        annualMileageKm:
          type: integer
        driverBirthYear:
          type: integer
        bonusClass:
          type: integer
          description: No-claims bonus class (market-specific scale).
  responses:
    E400:
      description: Request failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: Token lacks the required scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E429:
      description: Rate limit exceeded; honour the Retry-After header.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.1 via the Nordlys identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://auth.nordlys.example/realms/nordlys/protocol/openid-connect/token
          scopes:
            quote.create: Create and read quotes
            quote.bind: Bind a quote into a policy
