# GENERATED by scripts/catalog_gen - synthetic data for the fictional Nordlys Insurance.
openapi: 3.1.0
info:
  title: Document API
  version: 1.9.0
  description: Store and retrieve customer-facing documents and claim attachments (photos, receipts, medical certificates).
    Uploads are virus-scanned; files are available after status becomes `clean`. Use `/content` to download - links
    are pre-signed and valid 5 minutes.
  license:
    name: Proprietary - Nordlys Insurance internal use
    identifier: LicenseRef-Nordlys
  x-nordlys:
    api-id: document-api
    domain: documents
    owner-team: document-services
    countries:
    - SE
    - 'NO'
    - FI
    - DK
    - EE
    - LV
    - LT
    audience: internal
    data-classification: personal
    support: '#team-document-services'
    lifecycle:
      status: active
servers:
- url: https://api.nordlys.example/documents/v1
  description: Production
- url: https://api.test.nordlys.example/documents/v1
  description: Test
security:
- oauth2:
  - documents.read
paths:
  /documents:
    get:
      summary: List documents related to a policy, claim or customer
      operationId: listDocuments
      parameters:
      - name: relatedType
        in: query
        required: true
        schema:
          type: string
          enum:
          - policy
          - claim
          - customer
          - invoice
      - name: relatedId
        in: query
        required: true
        schema:
          type: string
      - name: kind
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        description: Cursor returned as `nextCursor` by the previous page.
        schema:
          type: string
      - name: limit
        in: query
        description: Page size (1-200).
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentMeta'
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    description: Opaque cursor for the next page, null on the last page.
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - documents.read
    post:
      summary: Upload a document
      description: multipart/form-data upload is also accepted; JSON variant takes base64 content (max 20 MB).
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - kind
              - relatedTo
              - fileName
              - contentBase64
              properties:
                kind:
                  type: string
                  enum:
                  - policy_schedule
                  - terms_and_conditions
                  - invoice
                  - claim_attachment
                  - claim_decision_letter
                  - green_card
                  - other
                relatedTo:
                  type: object
                  required:
                  - type
                  - id
                  properties:
                    type:
                      type: string
                      enum:
                      - policy
                      - claim
                      - customer
                      - invoice
                    id:
                      type: string
                fileName:
                  type: string
                contentBase64:
                  type: string
                  contentEncoding: base64
      responses:
        '201':
          description: Stored, scan pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentMeta'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - documents.write
  /documents/{documentId}:
    get:
      summary: Get document metadata
      operationId: getDocument
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentMeta'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - documents.read
  /documents/{documentId}/content:
    get:
      summary: Get a short-lived download link
      operationId: getDocumentContent
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Pre-signed URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - documents.read
components:
  schemas:
    Problem:
      type: object
      description: Error body following RFC 9457 (Problem Details for HTTP APIs).
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
          format: uri-reference
        title:
          type: string
          description: Short human-readable summary.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference for this occurrence.
          format: uri-reference
        correlationId:
          type: string
          description: Trace id to quote when contacting the owning team.
    Money:
      type: object
      description: A monetary amount.
      required:
      - amount
      - currency
      properties:
        amount:
          type: string
          description: Decimal amount as a string to avoid float rounding.
          pattern: ^-?\d+(\.\d{1,2})?$
        currency:
          type: string
          description: ISO 4217 currency code.
          enum:
          - SEK
          - NOK
          - DKK
          - EUR
    Country:
      type: string
      description: ISO 3166-1 alpha-2 market code.
      enum:
      - SE
      - 'NO'
      - FI
      - DK
      - EE
      - LV
      - LT
    DocumentMeta:
      type: object
      description: Document metadata. Content is fetched separately.
      required:
      - documentId
      - kind
      - relatedTo
      - mediaType
      properties:
        documentId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - policy_schedule
          - terms_and_conditions
          - invoice
          - claim_attachment
          - claim_decision_letter
          - green_card
          - other
        relatedTo:
          type: object
          required:
          - type
          - id
          properties:
            type:
              type: string
              enum:
              - policy
              - claim
              - customer
              - invoice
            id:
              type: string
        fileName:
          type: string
        mediaType:
          type: string
          description: e.g. application/pdf, image/jpeg
        sizeBytes:
          type: integer
        language:
          type: string
        createdAt:
          type: string
          format: date-time
        retentionUntil:
          type: string
          description: Deleted automatically after this date (retention policy).
          format: date
  responses:
    E400:
      description: Request failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: Token lacks the required scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E429:
      description: Rate limit exceeded; honour the Retry-After header.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.1 via the Nordlys identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://auth.nordlys.example/realms/nordlys/protocol/openid-connect/token
          scopes:
            documents.read: Read documents
            documents.write: Upload documents
