      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
          format: uri-reference
        title:
          type: string
          description: Short human-readable summary.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference for this occurrence.
          format: uri-reference
        correlationId:
          type: string
          description: Trace id to quote when contacting the owning team.
    Money:
      type: object
      description: A monetary amount.
      required:
      - amount
      - currency
      properties:
        amount:
          type: string
          description: Decimal amount as a string to avoid float rounding.
          pattern: ^-?\d+(\.\d{1,2})?$
        currency:
          type: string
          description: ISO 4217 currency code.
          enum:
          - SEK
          - NOK
          - DKK
          - EUR
    Country:
      type: string
      description: ISO 3166-1 alpha-2 market code.
      enum:
      - SE
      - 'NO'
      - FI
      - DK
      - EE
      - LV
      - LT
    MotorPolicy:
      type: object
      required:
      - id
      - policy_no
      - vehicle_reg_no
      - type
      properties:
        id:
          type: integer
          description: internal number
        policy_no:
