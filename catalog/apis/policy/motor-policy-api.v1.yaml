          description: Policy no. (format LT-MTPL-xxxxxxx)
        vehicle_reg_no:
          type: string
          description: Vehicle registration number (plate)
        vin:
          type: string
          description: VIN code
        holder_personal_code:
          type: string
          description: Personal code (isikukood / personas kods / asmens kodas) of holder
        type:
          type: string
          description: MTPL = compulsory motor third party, CASCO = own damage
