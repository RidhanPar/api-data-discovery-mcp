# GENERATED by scripts/catalog_gen - synthetic data for the fictional Nordlys Insurance.
openapi: 3.1.0
info:
  title: Policy API
  version: 2.3.0
  description: |-
    The system-of-record API for insurance policies across all Nordlys markets.

    Use it to read policies, their coverages and their version history, and to cancel policies. Mid-term changes (endorsements) live in the separate Policy Endorsement API.

    Breaking changes from v1: `policyNumber` path key replaced by `policyId`, premium is a `Money` object, status values are lower_snake_case, cancellation is idempotent.
  license:
    name: Proprietary - Nordlys Insurance internal use
    identifier: LicenseRef-Nordlys
  x-nordlys:
    api-id: policy-api
    domain: policy
    owner-team: policy-core
    countries:
    - SE
    - 'NO'
    - FI
    - DK
    - EE
    - LV
    - LT
    audience: internal
    data-classification: personal
    support: '#team-policy-core'
    lifecycle:
      status: active
servers:
- url: https://api.nordlys.example/policy/v2
  description: Production
- url: https://api.test.nordlys.example/policy/v2
  description: Test
security:
- oauth2:
  - policy.read
tags:
- name: Policies
  description: Read policies
- name: Cancellations
paths:
  /policies:
    get:
      tags:
      - Policies
      summary: Search policies
      description: Filter by customer, status, market and line of business. Cursor paginated.
      operationId: searchPolicies
      parameters:
      - name: customerId
        in: query
        description: Policyholder id.
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - quoted
          - in_force
          - lapsed
          - cancelled
          - expired
      - name: country
        in: query
        description: Market.
        schema:
          type: string
          description: ISO 3166-1 alpha-2 market code.
          enum:
          - SE
          - 'NO'
          - FI
          - DK
          - EE
          - LV
          - LT
      - name: productLine
        in: query
        description: Line of business.
        schema:
          type: string
      - name: cursor
        in: query
        description: Cursor returned as `nextCursor` by the previous page.
        schema:
          type: string
      - name: limit
        in: query
        description: Page size (1-200).
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: A page of policies
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Policy'
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    description: Opaque cursor for the next page, null on the last page.
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - policy.read
  /policies/{policyId}:
    get:
      tags:
      - Policies
      summary: Get a policy by id
      operationId: getPolicy
      parameters:
      - name: policyId
        in: path
        description: Policy id (UUID).
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - policy.read
  /policies/{policyId}/coverages:
    get:
      tags:
      - Policies
      summary: List coverages on a policy
      operationId: listCoverages
      parameters:
      - name: policyId
        in: path
        description: Policy id.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Coverages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Coverage'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - policy.read
  /policies/{policyId}/versions:
    get:
      tags:
      - Policies
      summary: Policy version history
      description: Every endorsement or renewal creates a new version. Newest first.
      operationId: listPolicyVersions
      parameters:
      - name: policyId
        in: path
        description: Policy id.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    version:
                      type: integer
                    validFrom:
                      type: string
                      format: date
                    changeType:
                      type: string
                      enum:
                      - new_business
                      - endorsement
                      - renewal
                      - cancellation
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
      security:
      - oauth2:
        - policy.read
  /policies/{policyId}/cancellations:
    post:
      tags:
      - Cancellations
      summary: Cancel a policy
      description: Schedules a cancellation. Idempotent via the `Idempotency-Key` header. Refund of unearned premium
        is calculated by the Premium Invoice API.
      operationId: cancelPolicy
      parameters:
      - name: policyId
        in: path
        description: Policy id.
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        description: Client-generated UUID; retries with the same key return the original result.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancellationRequest'
      responses:
        '202':
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
        '409':
          description: Policy already cancelled or expired.
      security:
      - oauth2:
        - policy.write
components:
  schemas:
    Problem:
      type: object
      description: Error body following RFC 9457 (Problem Details for HTTP APIs).
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
          format: uri-reference
        title:
          type: string
          description: Short human-readable summary.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference for this occurrence.
          format: uri-reference
        correlationId:
          type: string
          description: Trace id to quote when contacting the owning team.
    Money:
      type: object
      description: A monetary amount.
      required:
      - amount
      - currency
      properties:
        amount:
          type: string
          description: Decimal amount as a string to avoid float rounding.
          pattern: ^-?\d+(\.\d{1,2})?$
        currency:
          type: string
          description: ISO 4217 currency code.
          enum:
          - SEK
          - NOK
          - DKK
          - EUR
    Country:
      type: string
      description: ISO 3166-1 alpha-2 market code.
      enum:
      - SE
      - 'NO'
      - FI
      - DK
      - EE
      - LV
      - LT
    Policy:
      type: object
      description: An insurance policy as held in the policy administration system.
      required:
      - policyId
      - policyNumber
      - customerId
      - productLine
      - status
      - country
      - annualPremium
      properties:
        policyId:
          type: string
          description: Stable technical id (UUID). Prefer this over policyNumber.
          format: uuid
        policyNumber:
          type: string
          description: Human-readable policy number printed on documents.
        customerId:
          type: string
          description: Id of the policyholder in the Customer API.
          format: uuid
        productLine:
          type: string
          description: Line of business.
          enum:
          - home
          - motor
          - travel
          - pet
          - accident
          - commercial_property
        status:
          type: string
          description: Lifecycle state. `in_force` replaces v1 `ACTIVE`.
          enum:
          - quoted
          - in_force
          - lapsed
          - cancelled
          - expired
        country:
          $ref: '#/components/schemas/Country'
        inceptionDate:
          type: string
          description: Date cover starts.
          format: date
        expiryDate:
          type: string
          description: Date cover ends (exclusive).
          format: date
        annualPremium:
          $ref: '#/components/schemas/Money'
        paymentFrequency:
          type: string
          enum:
          - annual
          - semi_annual
          - quarterly
          - monthly
        brokerId:
          type:
          - string
          - 'null'
          description: Set when the policy was sold through a broker.
        updatedAt:
          type: string
          description: Last change timestamp (UTC).
          format: date-time
    Coverage:
      type: object
      description: A single cover included in the policy.
      required:
      - coverageCode
      - sumInsured
      properties:
        coverageCode:
          type: string
          description: Coverage code from the product catalogue, e.g. `HOME_CONTENTS`.
        name:
          type: string
          description: Display name in the customer's language.
        sumInsured:
          $ref: '#/components/schemas/Money'
        deductible:
          $ref: '#/components/schemas/Money'
    CancellationRequest:
      type: object
      required:
      - effectiveDate
      - reason
      properties:
        effectiveDate:
          type: string
          description: Date the cancellation takes effect.
          format: date
        reason:
          type: string
          enum:
          - customer_request
          - non_payment
          - moved_abroad
          - risk_sold
          - other
        comment:
          type: string
          description: Optional free text, max 500 chars.
          maxLength: 500
  responses:
    E400:
      description: Request failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: Token lacks the required scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E429:
      description: Rate limit exceeded; honour the Retry-After header.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.1 via the Nordlys identity provider.
      flows:
        clientCredentials:
          tokenUrl: https://auth.nordlys.example/realms/nordlys/protocol/openid-connect/token
          scopes:
            policy.read: Read policies and coverages
            policy.write: Cancel policies
        authorizationCode:
          authorizationUrl: https://auth.nordlys.example/realms/nordlys/protocol/openid-connect/auth
          tokenUrl: https://auth.nordlys.example/realms/nordlys/protocol/openid-connect/token
          scopes:
            policy.read: Read policies and coverages
            policy.write: Cancel policies
