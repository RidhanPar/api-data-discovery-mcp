          - lastName
          properties:
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
            nationalId:
              type: string
        riskObject:
          type: object
          description: Product-specific risk object (vehicle, gadget, trip).
        startDate:
          type: string
          format: date
  responses:
    E400:
      description: Request failed validation.
      content:
        application/problem+json:
